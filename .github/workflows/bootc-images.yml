---
name: bootc

# Constroi as imagens das VMs atomicas e publica-as em ghcr.io.
# As VMs adoptam-nas com 'bootc switch' e recebem actualizacoes automaticas.
# Ver bootc/README.md
#
# Num PR so constroi, nao publica: serve para um Containerfile partido falhar
# antes do merge e nao depois. E so constroi a imagem cujo directorio mudou.

on:
  push:
    branches: [main]
    paths:
      - "bootc/**"
      - ".github/workflows/bootc-images.yml"
  pull_request:
    paths:
      - "bootc/**"
      - ".github/workflows/bootc-images.yml"
  schedule:
    # semanal: apanha actualizacoes de seguranca das imagens base
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Evita empilhar execucoes quando ha varios pushes seguidos.
concurrency:
  group: bootc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Medido: devbox ~6 min, bazzite ~33 min. O limite existe para falhar em
    # vez de arrastar, nao porque se espere chegar la.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: homelab-devbox
            context: bootc/devbox
          - name: homelab-bazzite
            context: bootc/bazzite

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # o filtro abaixo compara com a base do PR

      - name: esta imagem mudou?
        # Fora de um PR constroi sempre. Num PR, so se o directorio da imagem
        # ou este workflow mudaram — um PR que so toca na devbox nao espera
        # pela bazzite.
        id: filtro
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "construir=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
               | grep -qE '^(${{ matrix.image.context }}/|\.github/workflows/bootc-images\.yml$)'; then
            echo "construir=true" >> "$GITHUB_OUTPUT"
          else
            echo "construir=false" >> "$GITHUB_OUTPUT"
            echo "sem alteracoes em ${{ matrix.image.context }} — nada a construir"
          fi

      - name: libertar espaco
        if: steps.filtro.outputs.construir == 'true'
        # O runner alojado traz 145 GB de raiz, dos quais ~114 GB ficam livres
        # depois desta limpeza — folga de sobra para a imagem base do Bazzite.
        # Fica na mesma porque custa cerca de um minuto e o "no space left on
        # device" e o modo de falha classico de quem constroi imagens bootc,
        # em runners mais pequenos ou auto-alojados.
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/local/.ghcup \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "espaco disponivel:"
          df -h /

      - name: construir
        if: steps.filtro.outputs.construir == 'true'
        id: build
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ matrix.image.name }}
          tags: latest ${{ github.sha }}
          context: ${{ matrix.image.context }}
          containerfiles: ${{ matrix.image.context }}/Containerfile
          oci: true

      - name: publicar
        # So na main e no agendamento semanal. Um PR nunca publica.
        if: steps.filtro.outputs.construir == 'true' && github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
